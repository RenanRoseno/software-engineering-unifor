version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: blood-registry-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blood_registry}
      POSTGRES_USER: ${POSTGRES_USER:-registry_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: blood-registry-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: blood-registry-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  donor-service:
    build:
      context: ../..
      dockerfile: backend/services/donor-service/Dockerfile
    container_name: blood-registry-donor-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-blood_registry}
      DB_USERNAME: ${POSTGRES_USER:-registry_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8081:8081"

  audit-service:
    build:
      context: ../..
      dockerfile: backend/services/audit-service/Dockerfile
    container_name: blood-registry-audit-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-blood_registry}
      DB_USERNAME: ${POSTGRES_USER:-registry_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "8084:8084"

  identity-gateway:
    build:
      context: ../..
      dockerfile: backend/services/identity-gateway/Dockerfile
    container_name: blood-registry-identity-gateway
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8090
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-blood_registry}
      DB_USERNAME: ${POSTGRES_USER:-registry_app}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://host.docker.internal:8080/realms/blood-registry}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-blood-registry-client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change_me}
    ports:
      - "8090:8090"

  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: blood-registry-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus

  grafana:
    image: grafana/grafana:11.1.0
    container_name: blood-registry-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  grafana-data:

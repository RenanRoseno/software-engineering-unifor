server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: identity-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/blood-registry}
      client:
        provider:
          keycloak:
            issuer-uri: ${JWT_ISSUER_URI:http://localhost:8080/realms/blood-registry}
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:blood-registry-client}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:change_me}
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
